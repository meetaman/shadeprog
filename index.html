<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dyeing Program Register</title>
    <style>
        :root {
            /* Dark Theme Variables (Zinc/Neutral Palette) */
            --primary-color: #3b82f6;
            /* Blue 500 (Kept for primary actions) */
            --background-color: #09090b;
            /* Zinc 950 (Deep Neutral Black) */
            --surface-color: #18181b;
            /* Zinc 900 (Dark Neutral Grey) */
            --surface-header: #27272a;
            /* Zinc 800 (Lighter Neutral Grey) */
            --text-primary: #e4e4e7;
            /* Zinc 200 (Off-white) */
            --text-secondary: #a1a1aa;
            /* Zinc 400 (Light Grey) */
            --border-color: #27272a;
            /* Zinc 800 */
            --success-color: #22c55e;
            /* Green 500 */
            --warning-color: #eab308;
            /* Yellow 500 */
            --danger-color: #ef4444;
            /* Red 500 */
            --input-bg: #09090b;
            /* Zinc 950 */
        }

        /* Global Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--background-color);
            color: var(--text-primary);
            line-height: 1.5;
            padding: 1rem;
        }

        /* Typography */
        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
            color: var(--text-primary);
        }

        p {
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
        }

        /* Container */
        .container {
            max-width: 640px;
            margin: 0 auto;
            padding-bottom: 4rem;
        }

        header {
            margin-bottom: 2rem;
            text-align: center;
        }

        header h1 {
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }

        /* Input Card */
        .card {
            background: var(--surface-color);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.3);
            /* Darker shadow */
            padding: 1.5rem;
            margin-bottom: 2rem;
            border: 1px solid var(--border-color);
        }

        .form-row {
            display: grid;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-secondary);
            /* Ensure visibility */
            margin-bottom: 0.5rem;
        }

        input,
        textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            background-color: var(--input-bg);
            color: var(--text-primary);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
            /* Matches blue */
        }

        textarea {
            min-height: 100px;
            resize: vertical;
            font-family: monospace;
        }

        input[type="date"] {
            color-scheme: dark;
            /* Native dark date picker */
        }

        button.btn-primary {
            display: block;
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            font-weight: 600;
            padding: 0.75rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button.btn-primary:hover {
            filter: brightness(1.1);
        }

        /* Register List */
        .register-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            /* Reduced gap */
        }

        .program-card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            /* Slightly reduced radius */
            box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.3);
            /* Dark shadow */
            overflow: hidden;
            transition: box-shadow 0.2s;
        }

        .program-card:hover {
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.4);
        }

        .program-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            /* Center vertically */
            padding: 0.75rem 1rem;
            /* Compact padding */
            background-color: var(--surface-header);
            /* Darker header */
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            /* Click header to toggle */
        }

        .header-title {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            /* No wrap in title */
            overflow: hidden;
        }

        .program-ref {
            font-weight: 700;
            font-size: 1rem;
            /* Slightly smaller font */
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .program-date {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 0.125rem;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            /* Tighter actions */
            flex-shrink: 0;
        }

        .status-badge {
            padding: 0.125rem 0.5rem;
            /* Smaller badge */
            border-radius: 4px;
            /* Rectangular-ish badge looks cleaner compact */
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Modified status colors for dark mode readability */
        .status-Pending {
            background: #334155;
            color: #94a3b8;
            border: 1px solid #475569;
        }

        .status-WIP {
            background: #451a03;
            color: #fbbf24;
            border: 1px solid #78350f;
        }

        .status-Done {
            background: #052e16;
            color: #4ade80;
            border: 1px solid #14532d;
        }

        .btn-action {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 0.25rem;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn-action svg {
            width: 18px;
            height: 18px;
        }

        .btn-action:hover {
            background-color: var(--surface-header);
            color: var(--primary-color);
        }

        .btn-delete {
            color: #ef4444;
            opacity: 0.7;
        }

        .btn-delete:hover {
            opacity: 1;
            background-color: rgba(239, 68, 68, 0.2);
            /* Red tint */
            color: #ef4444;
        }

        .chevron-icon {
            width: 16px;
            height: 16px;
            transition: transform 0.2s;
            color: var(--text-secondary);
        }

        .program-card.collapsed .chevron-icon {
            transform: rotate(-90deg);
        }

        .program-card.collapsed .shades-grid {
            display: none;
        }

        .program-card.collapsed .program-header {
            border-bottom: none;
            /* remove border when collapsed */
        }

        /* Progress Bar - Restored */
        .progress-bar-bg {
            height: 4px;
            background: var(--border-color);
            /* Darker track */
            width: 100%;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--success-color);
            transition: width 0.3s;
        }

        /* Checkbox Grid - Compact */
        .shades-grid {
            display: grid;
            /* Auto-fit columns, min-width 48px for touch targets */
            grid-template-columns: repeat(auto-fill, minmax(3.5rem, 1fr));
            gap: 0.5rem;
            padding: 0.75rem;
            /* Reduced padding */
            background: var(--surface-color);
            /* Match card */
        }

        .shade-check {
            display: flex;
            flex-direction: column;
            /* Stack input and label if wanted, or center */
            align-items: center;
            justify-content: center;
            gap: 0;
            /* Remove gap */
            background: var(--surface-header);
            /* Darker background for unchecked */
            padding: 0.35rem 0.25rem;
            border-radius: 6px;
            border: 1px solid transparent;
            /* No border initially for cleaner look */
            cursor: pointer;
            transition: all 0.1s;
            user-select: none;
            text-align: center;
            position: relative;
            /* For touch target expansion if needed */
        }

        /* Hide default checkbox visually but keep accessible?
           Or simplify. Let's keep checkbox but smaller. */
        .shade-check input[type="checkbox"] {
            /* Hide checkbox, style the container */
            display: none;
        }

        /* Container acts as "button" style */
        .shade-check {
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
        }

        .shade-check:hover {
            border-color: var(--primary-color);
        }

        .shade-check.completed {
            background-color: var(--success-color);
            /* Green background */
            border-color: var(--success-color);
            color: white;
            font-weight: bold;
        }

        .shade-label {
            font-family: monospace;
            /* Monospace for numbers */
            font-size: 0.9rem;
            line-height: 1.2;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 1rem;
            color: var(--text-secondary);
        }

        .backup-section {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border-color);
        }

        .btn-secondary {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.875rem;
        }

        .btn-secondary:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
            background-color: var(--surface-header);
        }

        /* Cloud Sync */
        .sync-section {
            position: fixed;
            bottom: 1rem;
            right: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(30, 41, 59, 0.9);
            /* Dark background */
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.5);
            border: 1px solid var(--border-color);
            font-size: 0.75rem;
            color: var(--text-secondary);
            backdrop-filter: blur(4px);
            z-index: 100;
        }

        .sync-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #cbd5e1;
        }

        .sync-dot.active {
            background-color: var(--success-color);
        }

        .sync-dot.error {
            background-color: var(--danger-color);
        }

        .sync-dot.syncing {
            background-color: var(--warning-color);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }

            100% {
                opacity: 1;
            }
        }

        /* Utility button style for backup/pull if needed */
        .btn-text {
            border: none;
            background: none;
            color: var(--primary-color);
            cursor: pointer;
            text-decoration: underline;
            font-size: 0.75rem;
            padding: 0;
            margin-left: 0.5rem;
        }

        /* Progress Bar - Restored */
        .progress-bar-bg {
            height: 4px;
            background: #e2e8f0;
            width: 100%;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--success-color);
            transition: width 0.3s;
        }

        @media (min-width: 640px) {
            .form-row {
                grid-template-columns: 1fr 2fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h3>Program Register</h3>
            <!-- <p>Track progress of individual color shades.</p> -->
        </header>

        <!-- Input Section -->
        <div class="card">
            <form id="trackerForm">
                <div class="form-row">
                    <div>
                        <label for="date">Date Received</label>
                        <input type="date" id="date" required>
                    </div>
                    <div>
                        <label for="rawProgram">Paste Program (Quality + Shades)</label>
                        <textarea id="rawProgram" placeholder="Example:&#10;koshi&#10;4.6.8.9.10..."
                            required></textarea>
                    </div>
                </div>
                <button type="submit" class="btn-primary">Add Program To Register</button>
            </form>
        </div>

        <!-- Register List Section -->
        <div id="registerList" class="register-list">
            <!-- Program Cards injected here -->
        </div>

        <div id="emptyState" class="empty-state" style="display: none;">
            <h3>No Programs Yet</h3>
            <p>Paste a program above to start tracking shades.</p>
        </div>

        <!-- Backup Section -->
        <!-- <div class="backup-section">
            <button class="btn-secondary" onclick="exportData()">Backup Data (Download JSON)</button>
            <input type="file" id="importFile" style="display: none;" onchange="importData(this)">
            <button class="btn-secondary" onclick="document.getElementById('importFile').click()">Restore Data</button>
        </div> -->
    </div>

    <!-- Floating Sync Status -->
    <div class="sync-section" id="syncStatus">
        <div class="sync-dot" id="syncDot"></div>
        <span id="syncText">Connecting...</span>
        <button class="btn-text" onclick="pullFromCloud()">Force Reload</button>
    </div>

    <script>
        const STORAGE_KEY = 'dyeing_tracker_v3_register';
        // Hardcoded URL provided by user
        const CLOUD_URL = 'https://script.google.com/macros/s/AKfycbx0yoGYeIp7j3yvyk3EzckIEsPWcsC7zJ8ptNyao78bPdkzQy7bma0arBHQu5Y05-NC/exec';

        let records = [];
        let syncTimeout = null;

        function setSyncStatus(state, message) { // state: 'active', 'syncing', 'error'
            const dot = document.getElementById('syncDot');
            const text = document.getElementById('syncText');
            // Reset classes
            dot.className = 'sync-dot ' + state;
            text.innerText = message;
        }

        async function pushToCloud() {
            setSyncStatus('syncing', 'Saving...');

            try {
                await fetch(CLOUD_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify(records)
                });

                setSyncStatus('active', 'All changes saved');
            } catch (err) {
                console.error(err);
                setSyncStatus('error', 'Save failed (Check connection)');
            }
        }

        async function pullFromCloud() {
            setSyncStatus('syncing', 'Syncing...');

            try {
                const response = await fetch(CLOUD_URL);
                if (!response.ok) throw new Error('Network error');

                const cloudData = await response.json();
                if (Array.isArray(cloudData)) {
                    // Merge strategy: Overwrite local with cloud (Cloud is Single Source of Truth)
                    records = cloudData;
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(records));

                    // Restore collapse states if needed, though they come from cloud now
                    records.forEach(r => {
                        if (typeof r.collapsed === 'undefined') r.collapsed = false;
                    });

                    render();
                    setSyncStatus('active', 'Up to date');
                } else {
                    setSyncStatus('active', 'Cloud empty (Using local)');
                }
            } catch (err) {
                console.error(err);
                setSyncStatus('error', 'Sync failed');
            }
        }

        function debounceSync() {
            setSyncStatus('syncing', 'Waiting to save...');
            if (syncTimeout) clearTimeout(syncTimeout);
            syncTimeout = setTimeout(() => {
                pushToCloud();
            }, 2000); // Auto-save 2 seconds after last change
        }

        function loadData() {
            // First load from local storage for instant render
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                records = JSON.parse(stored);
                render();
            }

            // Then immediately pull latest from cloud in background
            pullFromCloud();
        }

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
            render();
            debounceSync(); // Trigger cloud save
        }

        function parseInput(text) {
            const lines = text.trim().split(/\r?\n/).filter(l => l.trim());
            if (lines.length === 0) return null;

            const quality = lines[0].trim();
            const shadeText = lines.slice(1).join(' '); // Handle wrapped lines

            // Split by comma or dot
            const shadeValues = shadeText.split(/[.,]/)
                .map(s => s.trim())
                .filter(s => s !== '');

            // Create objects: { num: "4", done: false }
            // const shadeObjects = shadeValues.map(val => ({
            //     num: val,
            //     done: false
            // }));

            const ranges = [
                [8,15], [26,30], [48,55], [61,67], [118,120], [181,195],
                [158,163], [220,224], [38,45], [98,101], [80,83],
                [126,129], [293,298], [307,312], [112,114], [248,248]
            ];
            
            function isInRange(num) {
                return ranges.some(([start, end]) => num >= start && num <= end);
            }
            
            const shadeObjects = shadeValues.map(val => {
                const num = parseFloat(val);
            
                let displayVal = val;
            
                if (!isNaN(num) && isInRange(num)) {
                    displayVal = val + ' w';
                }
            
                return {
                    num: displayVal,
                    done: false
                };
            });

            // Sort ascending (natural sort for numbers)
            shadeObjects.sort((a, b) => {
                const numA = parseFloat(a.num);
                const numB = parseFloat(b.num);

                // If both are numbers, sort numerically
                if (!isNaN(numA) && !isNaN(numB)) {
                    return numA - numB;
                }
                // Fallback to string comparison for non-number shades (like "10A")
                return a.num.localeCompare(b.num, undefined, { numeric: true, sensitivity: 'base' });
            });

            return { quality, shadeObjects };
        }

        function calculateStatus(shades) {
            if (shades.length === 0) return 'Pending';
            const doneCount = shades.filter(s => s.done).length;
            if (doneCount === 0) return 'Pending';
            if (doneCount === shades.length) return 'Done';
            return 'WIP';
        }

        document.getElementById('trackerForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const date = document.getElementById('date').value;
            const text = document.getElementById('rawProgram').value;

            const parsed = parseInput(text);
            if (!parsed || parsed.shadeObjects.length === 0) return alert('No valid shades found!');

            const newRecord = {
                id: Date.now(),
                date: date,
                quality: parsed.quality,
                ref: `${date}_${parsed.quality}`,
                shades: parsed.shadeObjects,
                status: 'Pending',
                collapsed: false // Default open
            };

            records.unshift(newRecord);
            saveData();
            document.getElementById('rawProgram').value = '';
        });

        function toggleShade(recordId, shadeIndex) {
            const record = records.find(r => r.id === recordId);
            if (!record) return;

            // Toggle
            record.shades[shadeIndex].done = !record.shades[shadeIndex].done;
            // Update Status
            record.status = calculateStatus(record.shades);

            saveData(); // Calls render
        }

        function toggleCollapse(recordId) {
            const record = records.find(r => r.id === recordId);
            if (!record) return;
            record.collapsed = !record.collapsed;
            saveData();
        }

        function deleteRecord(id, event) {
            event.stopPropagation(); // Prevent card collapse toggle
            if (confirm('Delete this entire program record?')) {
                records = records.filter(r => r.id !== id);
                saveData();
            }
        }

        // Backup & Restore Logic
        function exportData() {
            const dataStr = JSON.stringify(records, null, 2);
            const blob = new Blob([dataStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);

            const a = document.createElement('a');
            a.href = url;
            a.download = `dyeing_tracker_backup_${new Date().toISOString().slice(0, 10)}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function importData(input) {
            const file = input.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        if (confirm('This will replace your current data with the backup. Continue?')) {
                            records = imported;
                            saveData();
                            alert('Data restored successfully!');
                        }
                    } else {
                        alert('Invalid backup file format.');
                    }
                } catch (err) {
                    alert('Error reading file: ' + err.message);
                }
            };
            reader.readAsText(file);
            input.value = ''; // Reset input
        }

        function render() {
            const listEl = document.getElementById('registerList');
            const emptyEl = document.getElementById('emptyState');
            listEl.innerHTML = '';

            if (records.length === 0) {
                emptyEl.style.display = 'block';
                return;
            }
            emptyEl.style.display = 'none';

            records.forEach(record => {
                // Calculate progress
                const doneCount = record.shades.filter(s => s.done).length;
                const total = record.shades.length;
                const progress = total === 0 ? 0 : (doneCount / total) * 100;

                const card = document.createElement('div');
                card.className = `program-card ${record.collapsed ? 'collapsed' : ''}`;

                const pendingCount = total - doneCount;

                card.innerHTML = `
                    <div class="program-header" onclick="toggleCollapse(${record.id})">
                        <div class="header-title">
                            <span class="program-ref">
                                <svg class="chevron-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                                ${record.ref}
                            </span>
                            <span class="program-date">
                                ${new Date(record.date).toLocaleDateString()} 
                                <span style="opacity: 0.7; margin-left: 8px;">• ${doneCount} Done / ${pendingCount} Pending</span>
                            </span>
                        </div>
                        <div class="header-actions">
                            <span class="status-badge status-${record.status}">${record.status === 'WIP' ? 'WIP' : record.status}</span>
                            <button class="btn-action btn-delete" onclick="deleteRecord(${record.id}, event)" title="Delete Program">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                            </button>
                        </div>
                    </div>
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" style="width: ${progress}%"></div>
                    </div>
                    <div class="shades-grid">
                        ${record.shades.map((shade, idx) => `
                            <div class="shade-check ${shade.done ? 'completed' : ''}" onclick="event.stopPropagation(); toggleShade(${record.id}, ${idx})">
                                <!-- Replaced checkbox with visual div -->
                                <span class="shade-label">${shade.num}</span>
                            </div>
                        `).join('')}
                    </div>
                `;
                listEl.appendChild(card);
            });
        }

        // Init
        document.getElementById('date').valueAsDate = new Date();
        loadData();
    </script>
</body>

</html>
